name = "CipherLean"
version = "0.1.0"
keywords = ["lean", "cryptography", "formalization"]
defaultTargets = ["CipherLean"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "CipherLean"
